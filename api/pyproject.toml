[project]
name = "canonico-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "httpx",
  "anthropic",
  "python-multipart",
  "pypdf",
  "python-docx",
  "email-validator",
  "boto3",
]

[project.optional-dependencies]
dev = ["datamodel-code-generator", "pytest", "moto[s3]", "jsonschema", "pyyaml", "rfc3339-validator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: end-to-end tests against a running server with a real model, run with make test-live", "docker: tests against a GreenMail container, run with make test-docker"]
