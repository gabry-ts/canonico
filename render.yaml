services:
  - type: web
    name: canonico-api
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install ./api
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CANONICO_COST_CAP_USD
        value: "2.00"
