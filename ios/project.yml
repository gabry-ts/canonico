name: Canonico
options:
  bundleIdPrefix: com.gabrielepartiti
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: X3G5QJ3P5A
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "202611141600"
    SWIFT_VERSION: "5.0"
targets:
  Canonico:
    type: application
    platform: iOS
    sources:
      - path: Canonico
    info:
      path: Canonico/Info.plist
      properties:
        CFBundleDisplayName: Canonico
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.canonico
        PRODUCT_NAME: Canonico
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  CanonicoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CanonicoUITests
    dependencies:
      - target: Canonico
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.canonico.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Canonico
schemes:
  Canonico:
    build:
      targets:
        Canonico: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CanonicoUITests
    archive:
      config: Release
