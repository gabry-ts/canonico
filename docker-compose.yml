# Canonico on one server: static site and reverse proxy (web) in front of the API (api).
# Start with `make docker-up`, then open http://localhost:${WEB_PORT:-8080}
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: api/.env
        required: false
    environment:
      CANONICO_STATE_FILE: /var/lib/canonico/state.json
      CANONICO_CACHE_DIR: /var/lib/canonico/cache
      CANONICO_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${WEB_PORT:-8080}}/api
      # Real mailbox: the organisation reads the GreenMail inbox below (mail mode imap). Demo-only password.
      CANONICO_IMAP_HOST: mail
      CANONICO_IMAP_PORT: "3143"
      CANONICO_IMAP_USER: brain
      CANONICO_IMAP_PASSWORD: ${CANONICO_IMAP_PASSWORD:-canonico-demo}
      CANONICO_IMAP_SSL: "false"
      CANONICO_SMTP_HOST: mail
      CANONICO_SMTP_PORT: "3025"
      # Document library on the Garage bucket below (provider s3)
      CANONICO_S3_ENDPOINT: http://garage:3900
      CANONICO_S3_BUCKET: canonico-library
      CANONICO_S3_ACCESS_KEY: ${CANONICO_S3_ACCESS_KEY:-}
      CANONICO_S3_SECRET_KEY: ${CANONICO_S3_SECRET_KEY:-}
    volumes:
      - canonico-runtime:/var/lib/canonico
    depends_on:
      mail:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  # Demo mail server (SMTP 3025, IMAP 3143), reachable only from the stack network. Mail is kept in memory.
  mail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=brain:${CANONICO_IMAP_PASSWORD:-canonico-demo}@inbound.meridianlabs.org
        -Dgreenmail.auth.disabled=false
    expose:
      - "3025"
      - "3143"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3143"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # S3-compatible object store for the document library, single node, reachable only from the stack network.
  garage:
    image: dxflrs/garage:v1.3.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"
      - "3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # One-shot, idempotent: layout, bucket canonico-library, access key and its grant.
  garage-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/init.sh"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      CANONICO_S3_BUCKET: canonico-library
      CANONICO_S3_ACCESS_KEY: ${CANONICO_S3_ACCESS_KEY:?set CANONICO_S3_ACCESS_KEY in .env}
      CANONICO_S3_SECRET_KEY: ${CANONICO_S3_SECRET_KEY:?set CANONICO_S3_SECRET_KEY in .env}
    volumes:
      - ./deploy/garage/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  # Runtime state (memory, audit log, answers) and caches of model and GitHub responses.
  canonico-runtime:
  # Garage metadata and object data of the document library
  garage-meta:
  garage-data:
