name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk canonico.apk

      - uses: actions/upload-artifact@v4
        with:
          name: canonico-android-apk
          path: android/canonico.apk

      - name: Publish android-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$GITHUB_SHA" \
              --title "Canonico Android (latest)" \
              --notes "Latest Android build from main. Sideload canonico.apk."
          fi
          gh release upload android-latest canonico.apk --clobber
          gh release edit android-latest --notes "Latest Android build from main ($GITHUB_SHA, run $GITHUB_RUN_NUMBER). Sideload canonico.apk."

  e2e:
    # Functional tests on an emulator against a local API started in the runner (never the live site).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Start local API (offline, auth required)
        run: |
          docker pull ghcr.io/gabry-ts/canonico-api:latest || docker build -t ghcr.io/gabry-ts/canonico-api:latest -f api/Dockerfile .
          docker run -d --name canonico-api -p 8000:8000 \
            -e CANONICO_AUTH_REQUIRED=true -e CANONICO_LLM_DISABLED=1 \
            ghcr.io/gabry-ts/canonico-api:latest
          for i in $(seq 1 60); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/health

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon || touch ../e2e-failed
            adb pull /data/local/tmp/canonico-shots ../e2e-screenshots || true

      - name: API log
        if: always()
        run: docker logs canonico-api 2>&1 | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonico-android-e2e
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            e2e-screenshots/

      - name: Fail if tests failed
        run: test ! -f e2e-failed
