name: docker

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "data/**"
      - "deploy/garage/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/gabry-ts/canonico-api
            context: .
            file: api/Dockerfile
            build_args: ""
          - name: web
            image: ghcr.io/gabry-ts/canonico-web
            context: web
            file: web/Dockerfile
            build_args: |
              VITE_API_URL=/api
          - name: garage
            image: ghcr.io/gabry-ts/canonico-garage
            context: .
            file: deploy/garage/Dockerfile
            build_args: ""
          - name: garage-init
            image: ghcr.io/gabry-ts/canonico-garage-init
            context: .
            file: deploy/garage/Dockerfile.init
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
