              schema:
                $ref: '#/components/schemas/TagRuleTestResult'
              example:
                project_id: proj-clearpath
                rule_id: tr-001
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
  /org/tag-rules/{rule_id}:
    patch:
      tags:
      - hooks
      operationId: patchTagRule
      summary: Update a tag routing rule
      description: Requires manage_sources.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRulePatch'
            example:
              priority: 5
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagRule'
              example:
                id: tr-001
                tag: clearpath
                project_id: proj-clearpath
                priority: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
    delete:
      tags:
      - hooks
      operationId: deleteTagRule
      summary: Delete a tag routing rule
      description: Requires manage_sources.
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - deleted
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
              example:
                id: tr-001
                deleted: true
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
  /projects/{project_id}/items:
    get:
      tags:
      - items
      operationId: listProjectItems
      summary: List items received by a project
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/InboundItemType'
      - name: tag
        in: query
        description: Only items carrying this tag.
        schema:
          type: string
        example: clearpath
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of items, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
              example:
                items:
                - id: itm-0001
                  project_id: proj-clearpath
                  type: meeting
                  title: Steering committee 12 Nov
                  date: '2026-11-12T10:00:00Z'
                  tags:
                  - clearpath
                  - topic:onboarding-target
                  participants:
                  - Sara Conti
                  - Marco Bianchi
                  source_id: src-clearpath-hook
                  document_id: hooks/meeting-2026-11-12-steering-committee
                  facts_count: 1
                  received_at: '2026-11-14T14:30:00Z'
                  routed_by: tag_rule
                total: 1
                limit: 50
                offset: 0
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
    post:
      tags:
      - items
      operationId: uploadProjectItem
      summary: Upload an item from the UI
      description: Manual upload. Send JSON, or multipart with a `file` and a `metadata` JSON part. Allowed for actors with the ask permission or above. The item is attributed to the actor.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundItem'
            example:
              type: note
              title: Call with ClearPath ops
              date: '2026-11-13T16:00:00Z'
              text: ClearPath ops confirmed the onboarding target is 3–4 weeks.
              tags:
              - clearpath
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InboundItemUpload'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Item accepted and processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundItemResult'
              example:
                item_id: itm-0001
                project_id: proj-clearpath
                routed_by: project_id
                rule_id: null
                document_id: hooks/note-2026-11-13-call-with-clearpath-ops
                facts_created:
                - M-301
                supersedes_created: []
                audit_event_id: a-0004
                duplicate: false
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
  /items/{item_id}:
    get:
      tags:
      - items
      operationId: getItem
      summary: Get one item with a text excerpt
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
        example: itm-0001
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
              example:
                id: itm-0001
                project_id: proj-clearpath
                type: meeting
                title: Steering committee 12 Nov
                date: '2026-11-12T10:00:00Z'
                tags:
                - clearpath
                - topic:onboarding-target
                participants:
                - Sara Conti
                - Marco Bianchi
                source_id: src-clearpath-hook
                document_id: hooks/meeting-2026-11-12-steering-committee
                facts_count: 1
                received_at: '2026-11-14T14:30:00Z'
                routed_by: tag_rule
                text_excerpt: We agreed the onboarding target stays at 3–4 weeks.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
  /tags:
    get:
      tags:
      - tags
      operationId: listTags
      summary: List tags with usage counts
      parameters:
      - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Tags in use.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagCount'
              example:
              - tag: clearpath
                count: 2
              - tag: topic:onboarding-target
                count: 2
        '401':
          $ref: '#/components/responses/SessionRequired'
      security:
      - sessionCookie: []
      - bearerAuth: []
      - {}
  /auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: Sign in with email and password
      description: Checks the credentials and opens a session of 12 hours. The token is returned in the body and set as the HttpOnly `canonico_session` cookie (SameSite=Lax, Secure over https). An unknown email and a wrong password give the same 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: giulia.ferri@meridianlabs.org
              password: canonico-demo
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The `canonico_session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unauthorized
                message: Wrong email or password.
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/demo-login:
    post:
      tags:
      - auth
      operationId: demoLogin
      summary: One-click demo sign-in
      description: Opens a session for a seeded member without a password, Giulia (owner) by default. Available only while `CANONICO_DEMO_LOGIN` is on (the default); otherwise 404.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
            example:
              member_id: mem-giulia-ferri
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The `canonico_session` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Sign out
      description: Revokes the session token, when there is one, and clears the cookie. Always 204.
      security: []
      responses:
        '204':
          description: Signed out.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: canonico_session
      description: Session cookie set by `POST /auth/login` or `POST /auth/demo-login`.
    bearerAuth:
      type: http
      scheme: bearer
      description: The session token returned by `POST /auth/login` in the Authorization header with the Bearer scheme.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred language of generated text. `it` gives Italian, anything else English. The `locale`
        query parameter or body field wins over this header.
      schema:
        type: string
      example: it-IT,it;q=0.9,en;q=0.8
    LocaleQuery:
      name: locale
      in: query
      required: false
      description: Language of generated text, `en` (default) or `it`. Wins over `Accept-Language`.
      schema:
        $ref: '#/components/schemas/Locale'
      example: it
    FactId:
      name: fact_id
      in: path
      required: true
      schema:
        type: string
      example: M-103
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
      example: MQ-001
    TopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
      example: onboarding-target
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: string
      example: ans-0007
    ProjectIdQuery:
      name: project_id
      in: query
      required: false
      description: Restrict to one project. When absent the request has organisation scope and sees all projects.
      schema:
        type: string
      example: proj-clearpath
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      example: proj-clearpath
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
      example: src-clearpath-mail
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
      example: rule-001
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: sync-0001
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
      example: mem-sara-conti
    CanonicoToken:
      name: X-Canonico-Token
      in: header
      required: true
      description: Webhook secret of the project or of the organisation.
      schema:
        type: string
      example: whsec_x7Kq2demo9f2a
    TagQuery:
      name: tag
      in: query
      required: false
      description: Only rows carrying this tag.
      schema:
        type: string
      example: clearpath
    DemoActorHeader:
      name: X-Demo-Actor
      in: header
      required: false
      description: Demo only, no real authentication. Member id or name of the acting demo identity.
      schema:
        type: string
      example: mem-sara-conti
  responses:
    SessionRequired:
      description: Sign-in required. Returned only when the server runs with `CANONICO_AUTH_REQUIRED=true` and the request has no valid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Sign in to continue.
    Unauthorized:
      description: Missing or invalid webhook token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Invalid X-Canonico-Token.
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_request
            message: Malformed JSON body.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Fact M-999 not found.
    Unprocessable:
      description: Validation failed (field missing or out of range).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: 'reason: field required'
    Conflict:
      description: State conflict (already resolved, cycle, not undoable, duplicate id).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: Conflict C-001 is already resolved.
    Forbidden:
      description: The actor lacks the permission required for this write (see GET /roles). Demo actor is set with X-Demo-Actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Role viewer lacks permission retire_fact.
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          examples:
          - giulia.ferri@meridianlabs.org
        password:
          type: string
          minLength: 1
          examples:
          - canonico-demo
    DemoLoginRequest:
      type: object
      properties:
        member_id:
          type: string
          description: Seeded member to sign in as. Giulia (owner) when omitted.
          examples:
          - mem-giulia-ferri
    LoginResponse:
      type: object
      required:
      - member
      - token
      - expires_at
      properties:
        member:
          $ref: '#/components/schemas/Member'
        token:
          type: string
          description: Session token, also set as the `canonico_session` cookie. Send it in the Authorization header with the Bearer scheme when cookies are not an option.
        expires_at:
          type: string
          format: date-time
    Locale:
      type: string
      enum:
      - en
      - it
      description: Language of the text generated by the backend. English when absent.
    FactType:
      type: string
      enum:
      - DECISION
      - CONSTRAINT
      - EVIDENCE
      - HYPOTHESIS
      - SUPERSEDED
      - OPEN
      description: DECISION is binding, OPEN is an open question.
    FactStatus:
      type: string
      enum:
      - active
      - retired
    Fact:
      type: object
      required:
      - id
      - topic
      - value
      - type
      - status
      - doc_id
      - quote
      - date
      - supersedes
      - superseded_by
      - confidence
      - retired_reason
      properties:
        project_id:
          type:
          - string
          - 'null'
          description: Owning project. Null or absent means organisation scope.
        id:
          type: string
          example: M-106
        topic:
          type: string
          description: Topic id.
          example: onboarding-target
        value:
          type: string
          example: 'Onboarding SLA: 3–4 weeks'
        type:
          $ref: '#/components/schemas/FactType'
        status:
          $ref: '#/components/schemas/FactStatus'
        doc_id:
          type: string
          example: 07-documents/report-final
        quote:
          type: string
          description: Verbatim source quote.
        date:
          type: string
          format: date
          example: '2025-11-28'
        supersedes:
          type:
          - string
          - 'null'
          description: Id of the older fact this one replaces.
        superseded_by:
          type:
          - string
          - 'null'
          description: Id of the newer fact that replaces this one.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.94
        retired_by:
          type:
          - string
          - 'null'
          description: Member name or id of who retired the fact.
          example: Giulia
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the fact was retired.
          example: '2026-11-14T15:20:00Z'
        retired_reason:
          type:
          - string
          - 'null'
        pinned:
          type: boolean
          default: false
          description: True when a person marked this fact as binding.
        tags:
          type: array
          items:
            type: string
          description: Free tags. `topic:<topic-id>` forces the topic.
    FactPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Fact'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Document:
      type: object
      required:
      - id
      - title
      - date
      - path
      properties:
        project_id:
          type:
          - string
          - 'null'
          description: Owning project. Null or absent means organisation scope.
        source_id:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 1
          default: 1
        version_of:
          type:
          - string
          - 'null'
          description: Id of the document this one is a new version of.
        id:
          type: string
          example: 07-documents/report-final
        title:
          type: string
        date:
          type: string
          format: date
        path:
          type: string
        text:
          type: string
          description: Full text, only on GET /documents/{doc_id}.
        current_version:
          type:
          - integer
          - 'null'
          description: Latest version number of the document's version chain.
        source_type:
          type:
          - string
          - 'null'
          enum:
          - documents
          - document_library
          - github
          - mail
          - webhook
          - null
        tags:
          type: array
          items:
            type: string
          description: Free tags. `topic:<topic-id>` forces the topic.
    Citation:
      type: object
      required:
      - doc_id
      - quote
      properties:
        doc_id:
          type: string
        quote:
          type: string
    Topic:
      type: object
      required:
      - id
      - label
      - fact_ids
      properties:
        project_id:
          type:
          - string
          - 'null'
          description: Owning project. Null or absent means organisation scope.
        id:
          type: string
          example: onboarding-target
        label:
          type: string
          example: Onboarding target
        fact_ids:
          type: array
          items:
            type: string
        binding_fact_id:
          type:
          - string
          - 'null'
          description: The fact that is binding on this topic now, as answers use it (the pinned fact, else the answer of a closed open question, else the latest live decision or constraint). Null when nothing is binding.
          example: M-106
    TopicChain:
      type: object
      required:
      - topic
      - facts
      properties:
        topic:
          $ref: '#/components/schemas/Topic'
        facts:
          type: array
          description: Oldest to newest.
          items:
            allOf:
            - $ref: '#/components/schemas/Fact'
            - type: object
              properties:
                doc_title:
                  type:
                  - string
                  - 'null'
                  description: Title of the document the fact comes from.
        changes:
          type: integer
          minimum: 0
          description: Number of times the value changes along the chain.
    AskRequest:
      type: object
      required:
      - question
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        project_id:
          type:
          - string
          - 'null'
          description: Restrict the answer to one project. Absence of project_id means organisation scope (all projects).
        question:
          type: string
          minLength: 1
        topic:
          type: string
          description: Optional topic id to scope the answer.
        include_plain_retrieval:
          type: boolean
          default: false
    PlainRetrieval:
      type: object
      required:
      - doc_id
      - quote
      - rank
      properties:
        doc_id:
          type: string
        quote:
          type: string
        rank:
          type: integer
          minimum: 1
    AskResponse:
      type: object
      required:
      - question
      - status
      - answer
      - binding
      - superseded
      - conflicts
      - citations
      - changed_because
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        changed_because_code:
          type:
          - string
          - 'null'
          description: 'Machine code of the first change behind `changed_because`: fact_retired, fact_restored, fact_corrected,
            fact_pinned, fact_unpinned, fact_linked, fact_unlinked, conflict_resolved, fact_added, fact_reclassified,
            change_undone, document_deleted, topic_merged, source_replaced, source_stated, memory_changed.'
          example: fact_retired
        changed_because_params:
          type:
          - object
          - 'null'
          description: Parameters of that change, language neutral. `actor`, `fact_id`, `value` and `source` of the
            fact, `changes` (how many changes are summarised) and, for changes that came from a source, `source_kind`,
            `replaced_fact_id` and `replaced_value`.
          additionalProperties: true
        question:
          type: string
        status:
          type: string
          enum:
          - binding
          - contested
          - no_answer
        answer:
          type: string
          description: Plain-language sentence.
        binding:
          oneOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        superseded:
          type: array
          items:
            $ref: '#/components/schemas/Fact'
        conflicts:
          type: array
          description: Contested values. For status contested these are the competing facts.
          items:
            $ref: '#/components/schemas/Fact'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        plain_retrieval:
          description: Present only when include_plain_retrieval is true.
          $ref: '#/components/schemas/PlainRetrieval'
        changed_because:
          type:
          - string
          - 'null'
          example: you retired requirement R1.1
        topic:
          type:
          - string
          - 'null'
          description: Topic the answer is about. Null when no topic matched the question. A `no_answer` can still name a topic, for example when only an estimate is recorded (the estimate is cited, `binding` stays null).
          example: onboarding-target
        answer_id:
          type: string
          description: Id of the stored answer record, readable with GET /answers/{answer_id}.
          example: ans-0001
    RetireRequest:
      type: object
      required:
      - reason
      - actor
      properties:
        reason:
          type: string
          minLength: 1
        actor:
          type: string
          minLength: 1
    RestoreRequest:
      type: object
      properties:
        actor:
          type: string
          default: anonymous
        reason:
          type: string
    AuditEvent:
      type: object
      required:
      - id
      - at
      - actor
      - action
      - fact_id
      - reason
      properties:
        summary:
          type: string
          description: The event in plain words, in the locale of the request. `reason` stays as it was written.
        summary_code:
          type: string
          description: Machine code of the summary, same vocabulary as `changed_because_code` plus email_received,
            item_received, version_uploaded, demo_reset and memory_seeded.
        summary_params:
          type: object
