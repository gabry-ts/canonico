  /ask/stream:
    post:
      tags:
      - ask
      operationId: askStream
      summary: Ask with Server-Sent Events
      description: |
        Same request as POST /ask. The response is `text/event-stream`. Events, in order:
        `retrieval` (data: list of candidate fact ids), `token` (data: `{"text": "..."}` chunk of the answer sentence, repeated),
        `final` (data: the complete AskResponse JSON, identical to the body of POST /ask), `error` (data: Error) on failure.
        The stream ends after `final` or `error`. The stored answer id is `answer_id` inside the final event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            example:
              question: What is the target time for onboarding new consultants?
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                event: retrieval
                data: {"fact_ids":["M-106","M-105","M-103"]}

                event: token
                data: {"text":"The onboarding target is "}

                event: token
                data: {"text":"3–4 weeks."}

                event: final
                data: {"question":"What is the target time for onboarding new consultants?","status":"binding","answer_id":"ans-0007"}

        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
