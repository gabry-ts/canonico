components:
  parameters:
    FactId:
      name: fact_id
      in: path
      required: true
      schema:
        type: string
      example: M-103
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
      example: MQ-001
    TopicId:
      name: topic_id
      in: path
      required: true
      schema:
        type: string
      example: onboarding-target
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema:
        type: string
      example: ans-0007
    ProjectIdQuery:
      name: project_id
      in: query
      required: false
      description: Restrict to one project. When absent the request has organisation scope and sees all projects.
      schema:
        type: string
      example: proj-clearpath
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      example: proj-clearpath
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
      example: src-clearpath-mail
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
      example: rule-001
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: sync-0001
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
      example: mem-sara-conti
    DemoActorHeader:
      name: X-Demo-Actor
      in: header
      required: false
      description: Demo only, no real authentication. Member id or name of the acting demo identity.
      schema:
        type: string
      example: mem-sara-conti
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_request
            message: Malformed JSON body.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Fact M-999 not found.
    Unprocessable:
      description: Validation failed (field missing or out of range).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_error
            message: 'reason: field required'
    Conflict:
      description: State conflict (already resolved, cycle, not undoable, duplicate id).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: conflict
            message: Conflict C-001 is already resolved.
    Forbidden:
      description: The actor lacks the permission required for this write (see GET /roles). Demo actor is set with X-Demo-Actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Role viewer lacks permission retire_fact.
  schemas:
    FactType:
      type: string
      enum:
      - DECISION
      - CONSTRAINT
      - EVIDENCE
      - HYPOTHESIS
      - SUPERSEDED
      - OPEN
      description: DECISION is binding, OPEN is an open question.
    FactStatus:
      type: string
      enum:
      - active
      - retired
    Fact:
      type: object
      required:
      - id
      - topic
      - value
      - type
      - status
      - doc_id
      - quote
      - date
      - supersedes
      - superseded_by
      - confidence
      - retired_reason
      properties:
        project_id:
          type:
          - string
          - 'null'
          description: Owning project. Null or absent means organisation scope.
        id:
          type: string
          example: M-106
        topic:
          type: string
          description: Topic id.
          example: onboarding-target
        value:
          type: string
          example: 'Onboarding SLA: 3–4 weeks'
        type:
          $ref: '#/components/schemas/FactType'
        status:
          $ref: '#/components/schemas/FactStatus'
        doc_id:
          type: string
          example: 07-documents/report-final
        quote:
          type: string
          description: Verbatim source quote.
        date:
          type: string
          format: date
          example: '2025-11-28'
        supersedes:
          type:
          - string
          - 'null'
