        mode:
          $ref: '#/components/schemas/MailMode'
        imap_host:
          type:
          - string
          - 'null'
        imap_user:
          type:
          - string
          - 'null'
        inbound_address:
          type:
          - string
          - 'null'
          description: Address the webhook provider forwards to.
        poll_interval_s:
          type: integer
          minimum: 5
          default: 60
        real_mailbox:
          description: Returned by `GET` and `PUT /org/mail`. The real mailbox this server is configured for (`CANONICO_IMAP_*`), which mode `imap` reads. Null when the server has none, and then mode `imap` is refused with 422.
          oneOf:
          - type: object
            required:
            - host
            properties:
              host:
                type: string
              user:
                type:
                - string
                - 'null'
          - type: 'null'
      example:
        mode: imap_mock
        imap_host: mock.meridianlabs.org
        imap_user: brain@meridianlabs.org
        inbound_address: brain@inbound.meridianlabs.org
        poll_interval_s: 60
    MailConfigWrite:
      type: object
      description: Write schema for mail settings. `password` is accepted on write only and never returned.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/MailMode'
        imap_host:
          type:
          - string
          - 'null'
        imap_user:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
          writeOnly: true
        inbound_address:
          type:
          - string
          - 'null'
          description: Must be an email address (422 otherwise). Blank is stored as null.
        poll_interval_s:
          type: integer
          minimum: 5
          default: 60
      example:
        mode: imap_mock
        imap_host: mock.meridianlabs.org
        imap_user: brain@meridianlabs.org
        password: demo-only
        inbound_address: brain@inbound.meridianlabs.org
        poll_interval_s: 60
