openapi: 3.1.0
info:
  title: Canonico API
  version: 0.1.0
  summary: Canonical memory for company brains.
  description: |
    Canonico ingests a company's documents, extracts facts, classifies each one
    (DECISION, CONSTRAINT, EVIDENCE, HYPOTHESIS, SUPERSEDED, OPEN), links facts on
    the same topic with SUPERSEDES edges ordered by date, and answers questions with
    the binding fact, its source quote, the facts it replaced and any conflicts.
    People can retire or restore a fact and the next answer changes. Every change is
    recorded in an audit log. A benchmark compares plain retrieval with Canonico.

    Conventions: JSON only, snake_case fields, ISO 8601 dates (`YYYY-MM-DD` for
    dates, RFC 3339 for timestamps), string ids.

    Language: text generated by the backend (answers, `changed_because`, audit summaries,
    maintenance details, curated conflict summaries, error messages) is returned in English
    by default and in Italian when asked. The locale comes from the `locale` query parameter
    or the `locale` field of AskRequest (`en` or `it`), else from the `Accept-Language`
    header, else English. Values and verbatim quotes of facts are never translated. Each
    generated sentence has a structured companion (`*_code` and `*_params`) so a client can
    compose its own text.

    Authentication: optional email and password sessions (`POST /auth/login`, or the one-click
    `POST /auth/demo-login`). The session token is sent back as the `canonico_session` cookie or as
    `Authorization: Bearer <token>`. Browsers should rely on the HttpOnly cookie and never store the
    token where page scripts can read it; the bearer form is for API clients. Sessions survive a restart
    of the server until they expire. When the server runs with `CANONICO_AUTH_REQUIRED=true`, every
    request, reads included, needs a session (401 otherwise), except `GET /health`, `/auth/*`, first-run
    setup (`/org/setup`, `/org/setup/status`) and the `/hooks/*` webhooks, which use their own
    `X-Canonico-Token`. With a session, the session member is the actor of the request and the
    `X-Demo-Actor` header and `actor` body fields are ignored. Without the flag, the demo actor rules
    below apply unchanged.

    Scope: the organisation is the global brain over all projects. Projects are isolated:
    a request with `project_id` only sees that project, a request without it has
    organisation scope and sees all projects. Real connectors (Gmail/Outlook OAuth,
    real IMAP/SMTP, SharePoint, Google Drive) are out of scope for the MVP.

    Demo corpus: OIDA Benchmark Corpora, `org-consulting-clearpath` (46 documents,
    26 queries, CC BY 4.0).
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:8000
  description: Local development
- url: https://api.canonico.example.com
  description: Production (placeholder)
tags:
- name: health
  description: Liveness check
- name: ask
  description: Ask a question and get the binding answer
- name: facts
  description: Extracted facts, retire and restore
- name: topics
  description: Topics and their supersedes chains
- name: documents
  description: Source documents
- name: audit
  description: Audit log of every change
- name: ingest
  description: Corpus ingestion jobs
- name: eval
  description: Benchmark, plain retrieval vs Canonico
- name: conflicts
  description: Contested topics and their resolution
- name: open-questions
  description: OPEN facts waiting for an answer
- name: maintenance
  description: Queue of facts proposed for retirement
- name: search
  description: Hybrid search and the plain retrieval baseline
- name: answers
  description: Stored answers, history and replay
- name: admin
  description: Stats, config, demo reset, export and import
- name: org
  description: The organisation, global brain over all projects. Single organisation in the MVP.
- name: projects
  description: Isolated projects inside the organisation
- name: sources
  description: Per-project sources (documents, document library, GitHub, mail, chat) and their sync jobs
- name: mail
  description: Mail configuration, routing rules, inbound webhook and mocked IMAP polling
- name: members
  description: Organisation and project members, roles and the demo actor
- name: hooks
  description: Inbound webhooks, webhook secrets and tag routing rules
- name: items
  description: Items (meetings, documents, notes, tickets) sent into a project by webhook or manual upload
- name: tags
  description: Tags on facts and documents
- name: auth
  description: Email and password sessions, demo sign-in and sign-out
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
              example:
                status: ok
                version: 0.1.0
  /ask:
    post:
      tags:
      - ask
      operationId: ask
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      summary: Ask a question
      description: |
        Returns the binding fact with its source quote, the superseded facts it
        replaced and any conflicts. `status` is `binding` when one fact wins,
        `contested` when sources disagree and none can be picked, `no_answer`
        when memory holds nothing relevant. `changed_because` is set when a
        retire or restore changed the answer compared with the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              onboarding:
                summary: q01, with plain retrieval comparison
                value:
                  question: What is the target time for onboarding new consultants?
                  include_plain_retrieval: true
              onboarding_it:
                summary: demo question, answer in Italian
                value:
                  question: How long does onboarding take?
                  locale: it
              audit_queue:
                summary: q02, scoped to a topic
                value:
                  question: How long does a report spend in the audit queue?
                  topic: audit-queue-time
      responses:
        '200':
          description: Answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
              examples:
                q01_before_retire:
                  summary: How long does onboarding take? (final report is binding)
                  value:
                    question: How long does onboarding take?
                    status: binding
                    answer: 'Three to four weeks. That is the onboarding time set in the final report on 28 November 2025. It replaced
                      4 earlier versions. One superseded figure is still active: 4 weeks (final presentation).'
                    binding:
                      project_id: proj-clearpath
                      id: M-106
                      topic: onboarding-target
                      value: 3–4 weeks
                      type: DECISION
                      status: active
                      doc_id: 07-documents/report-final
                      quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                      date: '2025-11-28'
                      supersedes: M-105
                      superseded_by: null
                      confidence: 0.94
                      retired_by: null
                      retired_at: null
                      retired_reason: null
                      pinned: false
                    superseded:
                    - project_id: proj-clearpath
                      id: M-101
                      topic: onboarding-target
                      value: ≈6 weeks
                      type: SUPERSEDED
                      status: active
                      doc_id: 01-scope/project-brief
                      quote: takes approximately six weeks before they can operate independently on client engagements.
                      date: '2025-08-22'
                      supersedes: null
