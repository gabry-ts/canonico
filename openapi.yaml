openapi: 3.1.0
info:
  title: Canonico API
  version: 0.1.0
  summary: Canonical memory for company brains.
  description: |
    Canonico ingests a company's documents, extracts facts, classifies each one
    (DECISION, CONSTRAINT, EVIDENCE, HYPOTHESIS, SUPERSEDED, OPEN), links facts on
    the same topic with SUPERSEDES edges ordered by date, and answers questions with
    the binding fact, its source quote, the facts it replaced and any conflicts.
    People can retire or restore a fact and the next answer changes. Every change is
    recorded in an audit log. A benchmark compares plain retrieval with Canonico.

    Conventions: JSON only, snake_case fields, ISO 8601 dates (`YYYY-MM-DD` for
    dates, RFC 3339 for timestamps), string ids.

    Authentication: none. This is a hackathon demo only, do not expose it publicly.

    Scope: the organisation is the global brain over all projects. Projects are isolated:
    a request with `project_id` only sees that project, a request without it has
    organisation scope and sees all projects. Real connectors (Gmail/Outlook OAuth,
    real IMAP/SMTP, SharePoint, Google Drive) are out of scope for the MVP.

    Demo corpus: OIDA Benchmark Corpora, `org-consulting-clearpath` (46 documents,
    26 queries, CC BY 4.0).
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:8000
  description: Local development
- url: https://api.canonico.example.com
  description: Production (placeholder)
tags:
- name: health
  description: Liveness check
- name: ask
  description: Ask a question and get the binding answer
- name: facts
  description: Extracted facts, retire and restore
- name: topics
  description: Topics and their supersedes chains
- name: documents
  description: Source documents
- name: audit
  description: Audit log of every change
- name: ingest
  description: Corpus ingestion jobs
- name: eval
  description: Benchmark, plain retrieval vs Canonico
- name: conflicts
  description: Contested topics and their resolution
- name: open-questions
  description: OPEN facts waiting for an answer
- name: maintenance
  description: Queue of facts proposed for retirement
- name: search
  description: Hybrid search and the plain retrieval baseline
- name: answers
  description: Stored answers, history and replay
- name: admin
  description: Stats, config, demo reset, export and import
- name: org
  description: The organisation, global brain over all projects. Single organisation in the MVP.
- name: projects
  description: Isolated projects inside the organisation
- name: sources
  description: Per-project sources (documents, document library, GitHub, mail, chat) and their sync jobs
- name: mail
  description: Mail configuration, routing rules, inbound webhook and mocked IMAP polling
- name: members
  description: Organisation and project members, roles and the demo actor
paths:
  /health:
    get:
      tags:
      - health
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
              example:
                status: ok
                version: 0.1.0
  /ask:
    post:
      tags:
      - ask
      operationId: ask
      summary: Ask a question
      description: |
        Returns the binding fact with its source quote, the superseded facts it
        replaced and any conflicts. `status` is `binding` when one fact wins,
        `contested` when sources disagree and none can be picked, `no_answer`
        when memory holds nothing relevant. `changed_because` is set when a
        retire or restore changed the answer compared with the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              onboarding:
                summary: q01, with plain retrieval comparison
                value:
                  question: What is the target time for onboarding new consultants?
                  include_plain_retrieval: true
              audit_queue:
                summary: q02, scoped to a topic
                value:
                  question: How long does a report spend in the audit queue?
                  topic: audit-queue-time
      responses:
        '200':
          description: Answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
              examples:
                q01_before_retire:
                  summary: q01 with an unresolved conflict
                  value:
                    question: What is the target time for onboarding new consultants?
                    status: binding
                    answer: The onboarding target is 3–4 weeks, set in the final report. One conflict remains, requirement
                      R1.1 still says 3 weeks or less.
                    binding:
                      id: M-106
                      topic: onboarding-target
                      value: 'Onboarding SLA: 3–4 weeks'
                      type: DECISION
                      status: active
                      doc_id: 07-documents/report-final
                      quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                      date: '2025-11-28'
                      supersedes: M-105
                      superseded_by: null
                      confidence: 0.94
                      retired_reason: null
                    superseded:
                    - id: M-105
                      topic: onboarding-target
                      value: 'Target recommendation: 4 weeks'
                      type: SUPERSEDED
                      status: active
                      doc_id: 05-meetings/meeting-005-final-presentation
                      quote: Our target recommendation is four weeks total for new consultants to be fully autonomous
                        and billing-ready.
                      date: '2025-11-21'
                      supersedes: null
                      superseded_by: M-106
                      confidence: 0.9
                      retired_reason: null
                    conflicts:
                    - id: M-103
                      topic: onboarding-target
                      value: 'Requirement R1.1: 3 weeks or less'
                      type: CONSTRAINT
                      status: active
                      doc_id: 01-scope/requirements
                      quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks
                        or less.
                      date: '2025-09-29'
                      supersedes: null
                      superseded_by: null
                      confidence: 0.88
                      retired_reason: null
                    citations:
                    - doc_id: 07-documents/report-final
                      quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                    - doc_id: 05-meetings/meeting-005-final-presentation
                      quote: Our target recommendation is four weeks total for new consultants to be fully autonomous
                        and billing-ready.
                    - doc_id: 01-scope/requirements
                      quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks
                        or less.
                    plain_retrieval:
                      doc_id: 01-scope/requirements
                      quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks
                        or less.
                      rank: 1
                    changed_because: null
                q01_after_retire:
                  summary: q01 after retiring requirement R1.1
                  value:
                    question: What is the target time for onboarding new consultants?
                    status: binding
                    answer: The onboarding target is 3–4 weeks, set in the final report. Requirement R1.1 (3 weeks
                      or less) is no longer binding.
                    binding:
                      id: M-106
                      topic: onboarding-target
                      value: 'Onboarding SLA: 3–4 weeks'
                      type: DECISION
                      status: active
                      doc_id: 07-documents/report-final
                      quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                      date: '2025-11-28'
                      supersedes: M-105
                      superseded_by: null
                      confidence: 0.94
                      retired_reason: null
                    superseded: []
                    conflicts: []
                    citations:
                    - doc_id: 07-documents/report-final
                      quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                    changed_because: you retired requirement R1.1
                q02_contested:
                  summary: q02, three estimates, nobody measured
                  value:
                    question: How long does a report spend in the audit queue?
                    status: contested
                    answer: Three people gave different estimates and nobody measured it, so there is no single
                      binding value.
                    binding: null
                    superseded: []
                    conflicts:
                    - id: M-201
                      topic: audit-queue-time
                      value: 3–4 business days (Marco Fiore, audit team lead)
                      type: HYPOTHESIS
                      status: active
                      doc_id: 02-subject/observation-003-audit-workflow
                      quote: 'Marco Fiore estimated: 3–4 business days'
                      date: '2025-10-02'
                      supersedes: null
                      superseded_by: null
                      confidence: 0.6
                      retired_reason: null
                    - id: M-202
                      topic: audit-queue-time
                      value: 6–8 business days (Laura Galli, audit team lead)
                      type: HYPOTHESIS
                      status: active
                      doc_id: 02-subject/observation-003-audit-workflow
                      quote: 'Laura Galli estimated: 6–8 business days'
                      date: '2025-10-02'
                      supersedes: null
                      superseded_by: null
                      confidence: 0.6
                      retired_reason: null
                    - id: M-203
                      topic: audit-queue-time
                      value: 2–3 days (junior auditor)
                      type: HYPOTHESIS
                      status: active
                      doc_id: 02-subject/observation-003-audit-workflow
                      quote: 'One junior auditor estimated: 2–3 days'
                      date: '2025-10-02'
                      supersedes: null
                      superseded_by: null
                      confidence: 0.6
                      retired_reason: null
                    citations:
                    - doc_id: 02-subject/observation-003-audit-workflow
                      quote: it was not possible to measure the actual time spent at each stage of the audit queue
                    - doc_id: 02-subject/bottleneck-analysis
                      quote: no data available — estimate only
                    plain_retrieval:
                      doc_id: 07-documents/report-final
                      quote: Audit process bottleneck (5–8 day average, 3–5 day variance)
                      rank: 1
                    changed_because: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /facts:
    get:
      tags:
      - facts
      operationId: listFacts
      summary: List facts
      parameters:
      - $ref: '#/components/parameters/ProjectIdQuery'
      - name: topic
        in: query
        description: Topic id.
        schema:
          type: string
        example: onboarding-target
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/FactType'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/FactStatus'
      - name: doc_id
        in: query
        schema:
          type: string
        example: 07-documents/report-final
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of facts, ordered by date descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactPage'
              example:
                items:
                - id: M-106
                  topic: onboarding-target
                  value: 'Onboarding SLA: 3–4 weeks'
                  type: DECISION
                  status: active
                  doc_id: 07-documents/report-final
                  quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                  date: '2025-11-28'
                  supersedes: M-105
                  superseded_by: null
                  confidence: 0.94
                  retired_reason: null
                total: 1
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
      - facts
      operationId: createFact
      summary: Create a fact manually
      description: Writes an audit event (action create). The fact is linked into the topic chain by date. If a
        fact with the same topic and a later date exists, the new fact gets `superseded_by` set automatically only
        when requested via the supersede endpoint, never implicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactCreate'
            example:
              topic: onboarding-target
              value: Onboarding SLA confirmed at 3–4 weeks by the steering committee
              type: DECISION
              doc_id: 05-meetings/meeting-005-final-presentation
              quote: Our target recommendation is four weeks total for new consultants to be fully autonomous and
                billing-ready.
              date: '2025-12-02'
              confidence: 1.0
              actor: gabriele
      responses:
        '201':
          description: Created fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              example:
                id: M-301
                topic: onboarding-target
                value: Onboarding SLA confirmed at 3–4 weeks by the steering committee
                type: DECISION
                status: active
                doc_id: 05-meetings/meeting-005-final-presentation
                quote: Our target recommendation is four weeks total for new consultants to be fully autonomous
                  and billing-ready.
                date: '2025-12-02'
                supersedes: null
                superseded_by: null
                confidence: 1.0
                retired_reason: null
                pinned: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /facts/{fact_id}:
    get:
      tags:
      - facts
      operationId: getFact
      summary: Get one fact
      parameters:
      - $ref: '#/components/parameters/FactId'
      responses:
        '200':
          description: The fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              example:
                id: M-103
                topic: onboarding-target
                value: 'Requirement R1.1: 3 weeks or less'
                type: CONSTRAINT
                status: active
                doc_id: 01-scope/requirements
                quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks or less.
                date: '2025-09-29'
                supersedes: null
                superseded_by: null
                confidence: 0.88
                retired_reason: null
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - facts
      operationId: patchFact
      summary: Correct a fact
      description: Edits value, type and/or topic. A reason is mandatory. Writes an audit event (action patch) and
        a new entry in the fact history.
      parameters:
      - $ref: '#/components/parameters/FactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactPatch'
            example:
              value: 'Onboarding SLA: 3–4 weeks (target, not guarantee)'
              reason: Clarified wording after review with the engagement lead.
              actor: gabriele
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Updated fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              examples:
                updated:
                  $ref: '#/components/examples/FactM106'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /facts/{fact_id}/retire:
    post:
      tags:
      - facts
      operationId: retireFact
      summary: Retire a fact
      description: Marks the fact as retired (never deleted) and writes an audit event. The next answer will not
        use it. Retiring an already retired fact is idempotent and returns 200.
      parameters:
      - $ref: '#/components/parameters/FactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireRequest'
            example:
              reason: Replaced by the final report, which sets 3–4 weeks.
              actor: gabriele
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The updated fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              example:
                id: M-103
                topic: onboarding-target
                value: 'Requirement R1.1: 3 weeks or less'
                type: CONSTRAINT
                status: retired
                doc_id: 01-scope/requirements
                quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks or less.
                date: '2025-09-29'
                supersedes: null
                superseded_by: M-106
                confidence: 0.88
                retired_reason: Replaced by the final report, which sets 3–4 weeks.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /facts/{fact_id}/restore:
    post:
      tags:
      - facts
      operationId: restoreFact
      summary: Restore a retired fact
      description: Sets the fact back to active and writes an audit event. Idempotent.
      parameters:
      - $ref: '#/components/parameters/FactId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            example:
              actor: gabriele
              reason: Retired by mistake.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The updated fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              example:
                id: M-103
                topic: onboarding-target
                value: 'Requirement R1.1: 3 weeks or less'
                type: CONSTRAINT
                status: active
                doc_id: 01-scope/requirements
                quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks or less.
                date: '2025-09-29'
                supersedes: null
                superseded_by: null
                confidence: 0.88
                retired_reason: null
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /topics:
    get:
      tags:
      - topics
      operationId: listTopics
      summary: List topics
      parameters:
      - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: All topics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'
              example:
              - id: onboarding-target
                label: Onboarding target
                fact_ids:
                - M-101
                - M-102
                - M-103
                - M-104
                - M-105
                - M-106
                - M-107
              - id: audit-queue-time
                label: Audit queue time
                fact_ids:
                - M-201
                - M-202
                - M-203
                - M-204
                - M-205
                - M-206
                - M-207
                - M-208
    post:
      tags:
      - topics
      operationId: createTopic
      summary: Create a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
            example:
              id: billing-rate
              label: Billing rate
      responses:
        '201':
          description: Created topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
              example:
                id: billing-rate
                label: Billing rate
                fact_ids: []
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /topics/{topic_id}/chain:
    get:
      tags:
      - topics
      operationId: getTopicChain
      summary: Supersedes chain of a topic
      description: Facts of the topic ordered oldest to newest. Each fact's `supersedes` points to the older fact
        it replaces. Retired facts are included with status `retired`.
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
        example: onboarding-target
      responses:
        '200':
          description: Ordered chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicChain'
              example:
                topic:
                  id: onboarding-target
                  label: Onboarding target
                  fact_ids:
                  - M-103
                  - M-105
                  - M-106
                facts:
                - id: M-103
                  topic: onboarding-target
                  value: 'Requirement R1.1: 3 weeks or less'
                  type: CONSTRAINT
                  status: active
                  doc_id: 01-scope/requirements
                  quote: Reduce time-to-independence for new consultants from the current ~6 weeks to 3 weeks or
                    less.
                  date: '2025-09-29'
                  supersedes: null
                  superseded_by: null
                  confidence: 0.88
                  retired_reason: null
                - id: M-105
                  topic: onboarding-target
                  value: 'Target recommendation: 4 weeks'
                  type: SUPERSEDED
                  status: active
                  doc_id: 05-meetings/meeting-005-final-presentation
                  quote: Our target recommendation is four weeks total for new consultants to be fully autonomous
                    and billing-ready.
                  date: '2025-11-21'
                  supersedes: null
                  superseded_by: M-106
                  confidence: 0.9
                  retired_reason: null
                - id: M-106
                  topic: onboarding-target
                  value: 'Onboarding SLA: 3–4 weeks'
                  type: DECISION
                  status: active
                  doc_id: 07-documents/report-final
                  quote: 'Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)'
                  date: '2025-11-28'
                  supersedes: M-105
                  superseded_by: null
                  confidence: 0.94
                  retired_reason: null
        '404':
          $ref: '#/components/responses/NotFound'
  /documents:
    get:
      tags:
      - documents
      operationId: listDocuments
      summary: List documents (without text)
      parameters:
      - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: All ingested documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
              - id: 07-documents/report-final
                title: Final report
                date: '2025-11-28'
                path: 07-documents/report-final.md
              - id: 01-scope/requirements
                title: Requirements
                date: '2025-09-29'
                path: 01-scope/requirements.md
    post:
      tags:
      - documents
      operationId: createDocument
      summary: Upload a document
      description: Accepts JSON with text or markdown, or multipart with a text, markdown or PDF file. With `ingest`
        true (default) an ingestion job is started and returned in the `ingest_job` field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
            example:
              id: 07-documents/addendum-onboarding
              title: Onboarding addendum
              date: '2025-12-05'
              format: markdown
              text: |
                # Addendum

                The onboarding SLA stays at 3–4 weeks.
              ingest: true
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
      responses:
        '201':
          description: Stored document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCreated'
              example:
                document:
                  id: 07-documents/addendum-onboarding
                  title: Onboarding addendum
                  date: '2025-12-05'
                  path: 07-documents/addendum-onboarding.md
                ingest_job:
                  id: job-8c10
                  kind: ingest
                  status: queued
                  docs: 0
                  facts: 0
                  cost_usd: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /documents/{doc_id}:
    get:
      tags:
      - documents
      operationId: getDocument
      summary: Get a document with full text
      description: '`doc_id` contains a slash, so clients must URL-encode it (`07-documents%2Freport-final`). The
        backend must accept the encoded form.'
      parameters:
      - name: doc_id
        in: path
        required: true
        description: URL-encoded document id.
        schema:
          type: string
        example: 07-documents%2Freport-final
      responses:
        '200':
          description: The document including `text`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: 07-documents/report-final
                title: Final report
                date: '2025-11-28'
                path: 07-documents/report-final.md
                text: |
                  # Final report

                  ## Recommendations

                  Establish onboarding SLA: 3–4 weeks (vs. current 6–8 weeks)
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - documents
      operationId: deleteDocument
      summary: Delete a document and its facts
      description: Removes the document and every fact extracted from it. Supersedes links that pointed to removed
        facts are cleared. Writes audit events (action delete_document). Irreversible except through POST /audit/{event_id}/undo.
      parameters:
      - name: doc_id
        in: path
        required: true
        description: URL-encoded document id.
        schema:
          type: string
        example: 05-meetings%2Fmeeting-005-final-presentation
      - name: actor
        in: query
        required: true
        schema:
          type: string
        example: gabriele
      responses:
        '200':
          description: Deletion summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleted'
              example:
                doc_id: 05-meetings/meeting-005-final-presentation
                deleted_fact_ids:
                - M-105
                - M-207
                audit_event_id: a-0043
        '404':
          $ref: '#/components/responses/NotFound'
