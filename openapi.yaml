        in: query
        description: Topic id.
        schema:
          type: string
        example: onboarding-target
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/FactType'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/FactStatus'
      - name: doc_id
        in: query
        schema:
          type: string
        example: 07-documents/report-final
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
